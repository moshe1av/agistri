<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#062A4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="אגיסטרי">
  <title>אגיסטרי — חמישה ימים באי הירוק, 12–16 באוקטובר 2026</title>
  <meta name="description" content="אתר תלת־ממד סינמטי של טיול לאגיסטרי, יוון: מאתונה ופיראוס אל חופי אפוניסוס ודראגונרה, סקאלה ומגאלוחורי. מסלול יומי, מרחקי הפלגה, חופים, טברנות ושקיעות.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">

  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader__inner">
      <div class="loader__brand">אגיסטרי</div>
      <div class="loader__dates">12–16 באוקטובר 2026</div>
      <div class="loader__bar"><span id="loader-fill"></span></div>
      <div class="loader__msg" id="loader-msg">מכינים את הים</div>
    </div>
  </div>

  <canvas id="scene" aria-hidden="true"></canvas>

  <div id="pins" class="pins" aria-label="מקומות על המפה"></div>

  <header id="topbar" class="topbar">
    <a class="brand" href="#top">אגיסטרי <small>12–16.10.2026</small></a>
    <div class="topbar__actions">
      <button id="btn-audio" class="icon-btn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        <span>צליל כבוי</span>
      </button>
      <button id="btn-quality" class="icon-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
        <span>איכות גבוהה</span>
      </button>
      <button id="btn-info" class="icon-btn icon-btn--accent" type="button" aria-expanded="false" aria-controls="drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4V5zM20 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8V5z"/></svg>
        <span>מדריך האי</span>
      </button>
    </div>
  </header>

  <nav id="timeline" class="timeline" aria-label="ציר זמן של הטיול"></nav>

  <main id="story" class="story"></main>

  <div id="scroll-hint" class="hint" aria-hidden="true">
    <span class="hint__line"></span>
    <span class="hint__text">גללו כדי להפליג</span>
  </div>

  <div id="drawer" class="drawer"></div>
  <div id="modal" class="modal"></div>

  <script type="module" src="main.js"></script>
</body>
</html>
